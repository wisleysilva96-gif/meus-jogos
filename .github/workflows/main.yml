name: Compilar Jogo NXNative Completo (macOS ARM64)

on:
  workflow_dispatch:
    inputs:
      gdrive_id:
        description: 'ID do arquivo no Google Drive (ou URL direta)'
        required: true
        type: string
      use_separate_romfs:
        description: 'Separar RomFS? (Deixe marcado para jogos maiores que 4GB)'
        required: false
        default: true
        type: boolean

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  ALLOW_OTHER_METAL: "True"

jobs:
  build_ipa:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: 1. Selecionar Xcode mais recente
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: 2. Instalar dependencias no Mac
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          brew install xcodegen zstd glslang sevenzip python@3.15 || true
          brew install --cask dotnet-sdk || true
          # Instala diretamente as dependências no Python 3.15 sem tentar atualizar o pip do sistema
          /opt/homebrew/opt/python@3.15/bin/python3.15 -m pip install --break-system-packages --ignore-installed lz4 "capstone>=5,<6" fonttools nsz gdown zbic pycryptodome

      - name: 3. Clonar nxnative e aplicar patches de SDK
        run: |
          git clone https://github.com/seedds/nxnative.git
          sed -i '' 's/.*deviceMotionBody.*/\/\/ &/' nxnative/dm/ios/Sources/DmGamepad.m
          sed -i '' 's/.*colorContentOffsetX.*/\/\/ &/' nxnative/dm/gfx/nvn/nvn_mtl.m
          sed -i '' 's/.*depthContentOffsetX.*/\/\/ &/' nxnative/dm/gfx/nvn/nvn_mtl.m
          sed -i '' 's/.*motionContentOffsetX.*/\/\/ &/' nxnative/dm/gfx/nvn/nvn_mtl.m
          sed -i '' 's/.*outputOffsetX.*/\/\/ &/' nxnative/dm/gfx/nvn/nvn_mtl.m

      - name: 4. Recriar o arquivo prod.keys
        env:
          KEYS_CONTENT: ${{ secrets.PROD_KEYS }}
        run: |
          mkdir -p ~/keys
          echo "$KEYS_CONTENT" > ~/keys/prod.keys

      - name: 5. Transferir e extrair o jogo
        run: |
          mkdir -p ~/Games/TargetGame
          INPUT="${{ inputs.gdrive_id }}"
          if [[ "$INPUT" == *"drive.google.com"* ]]; then
            FILE_ID=$(echo "$INPUT" | sed -n 's/.*\/d\/\([a-zA-Z0-9_-]*\).*/\1/p')
            [ -z "$FILE_ID" ] && FILE_ID=$(echo "$INPUT" | sed -n 's/.*id=\([a-zA-Z0-9_-]*\).*/\1/p')
            /opt/homebrew/opt/python@3.15/bin/python3.15 -m gdown "$FILE_ID" -O "$HOME/pacote_jogo"
          elif [[ "$INPUT" != http* ]]; then
            /opt/homebrew/opt/python@3.15/bin/python3.15 -m gdown "$INPUT" -O "$HOME/pacote_jogo"
          else
            curl -L "$INPUT" -o "$HOME/pacote_jogo"
          fi
          7z x "$HOME/pacote_jogo" -o"$HOME/Games/TargetGame/" -y || mv "$HOME/pacote_jogo" "$HOME/Games/TargetGame/jogo.xci"
          rm -f "$HOME/pacote_jogo"
          find ~/Games/TargetGame/ -mindepth 2 -type f \( -name "*.nsp" -o -name "*.xci" -o -name "*.nsz" -o -name "*.xcz" \) -exec mv {} ~/Games/TargetGame/ \;

      - name: 6. Compilar o jogo (IPA + RomFS.img)
        run: |
          cd nxnative
          # Garante que as dependências estão presentes
          /opt/homebrew/opt/python@3.15/bin/python3.15 -m pip install lz4 "capstone>=5,<6" fonttools zbic --break-system-packages
          
          # Procura especificamente pelo script de build ou cli principal (ignorando scripts de dump)
          SCRIPT_FILE=$(find . -maxdepth 3 -name "*.py" | grep -E "build|cli|main|pack\.py" | grep -v "pack_dump" | head -n 1)
          if [ -z "$SCRIPT_FILE" ]; then
            SCRIPT_FILE="main.py"
          fi
          echo "Utilizando script de compilação corrigido: $SCRIPT_FILE"
          
          mkdir -p ~/OutputFinal
          # Executa o script de build correto passando os parâmetros esperados pelo nxnative
          /opt/homebrew/opt/python@3.15/bin/python3.15 "$SCRIPT_FILE" ~/Games/TargetGame ~/OutputFinal
      - name: 7. Guardar IPA e RomFS.img para Download
        uses: actions/upload-artifact@v4
        with:
          name: Jogo-Switch-Completo
          path: ~/OutputFinal/*
          retention-days: 5
